# Keeps the PartyKit room server in lockstep with the Vercel frontend.
#
# Why this exists: the app deploys as two halves — the Vercel frontend (auto-
# deploys on push) and the PartyKit room server (the authoritative rules
# engine, in party/index.ts). When only the frontend was redeployed, the UI
# offered new content (e.g. Moandor/Zydar, Hire a Secondary Hero) that the
# stale room server then silently rejected. This workflow redeploys PartyKit
# on every push to the production branch so both halves always match.
#
# One-time setup — add these repository secrets (Settings → Secrets and
# variables → Actions):
#   PARTYKIT_TOKEN  — required for non-interactive auth. Generate locally with
#                     `npx partykit token generate` (run `npx partykit login`
#                     first) and paste the value.
#   PARTYKIT_LOGIN  — your PartyKit/GitHub username (the "<user>" in
#                     heroes3bg-rooms.<user>.partykit.dev, e.g. klwar19).
#
#   HOMM3BG_APP_URL — REQUIRED for verified accounts to work on the edge: the
#                     PUBLIC URL of your deployed app (e.g. https://your-app.
#                     vercel.app, no trailing slash). The edge is a different
#                     origin from the app, so it CANNOT read your login cookie;
#                     it verifies a signed-in player (and whether they are a
#                     platform ADMIN) by calling this URL's /api/auth/verify-
#                     token. WITHOUT it every player is a guest on the edge, so
#                     admins can't delete rooms, verified-account-only rooms
#                     reject everyone, and seat ownership never binds to accounts.
#   HOMM3BG_ADMIN_KEY — optional break-glass: a shared secret that wipes/closes
#                     ANY room. Set the SAME value here and in the browser
#                     (localStorage["homm3bg.adminKey"]). Independent of the app
#                     URL, so it works even if HOMM3BG_APP_URL is unset.
#   HOMM3BG_MATCH_REPORT_KEY — optional: shared secret so the edge can post
#                     finished ranked matches back to the app (must match the
#                     app's value).
#
# Only PARTYKIT_TOKEN/PARTYKIT_LOGIN are mandatory; an unset optional secret is
# simply not passed (the edge behaves exactly as before for that feature).
#
# NOTE: the trigger branch below must match the branch Vercel deploys to
# production. Change `main` if your Vercel production branch is different.
#
# WHY THE DEPLOY IS GATED ON THE ENGINE SUITE, NOT THE WHOLE TEST RUN
# ------------------------------------------------------------------
# The recurring "room server out of date" banner had a second, worse cause than
# the lockfile drift below: the deploy job gated on the ENTIRE `npm test` run,
# which includes UI-component tests (src/components, src/app — jsdom) and media
# ASSET-size gates (src/data/**-art) that CANNOT affect the room server at all.
# party/index.ts imports only `@/engine` and `@/server`, so a placeholder webp
# that is a few KB too small, or a jsdom UI regression, would fail `npm test`
# and STRAND the authoritative rules engine at an old protocol version while
# Vercel (which never gates on tests) kept shipping the new UI. That asymmetry
# is exactly the "server out of date" pain, and no amount of retrying fixes it
# because those failures are unrelated to the engine.
#
# So the `deploy` job below gates on the tests that actually protect the room
# server — `src/engine` + `src/server` — plus a full typecheck. The full test
# suite still runs, in a SEPARATE `full-suite` job that is NON-blocking
# (continue-on-error) purely for signal: UI/art debt shows up as an annotation
# without ever holding the engine hostage. This keeps the stated safety intent
# ("never ship a room server that fails the RULES tests or typecheck") while
# making the auto-deploy actually reliable.

name: Deploy PartyKit

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two deploys race; keep only the newest per branch.
concurrency:
  group: deploy-partykit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-partykit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Install deps. Prefer a strict, reproducible clean install — but NEVER let
      # the PartyKit deploy be blocked by a cross-platform lockfile quirk in an
      # OPTIONAL native dep. sharp's wasm32 fallback (@img/sharp-wasm32) pulls
      # @emnapi/* transitive deps that float on a caret range (^1.7.0); the
      # package-lock.json committed from a Windows dev box lags the version the
      # Linux runner's `npm ci` recomputes (e.g. lock has 1.11.0, registry now
      # ships 1.11.2), so `npm ci` rejects the lockfile as "out of sync" and dies
      # before the deploy. Meanwhile Vercel installs the frontend leniently and
      # keeps shipping — that asymmetry is exactly what drifts the room server
      # behind the UI (the recurring "room server out of date" banner). Every new
      # upstream patch re-triggers it, hence "keeps happening". The fallback
      # repairs the tree (same lenient resolve Vercel does) for this and any
      # FUTURE optional-dep drift, so both halves always deploy in lockstep. The
      # repair is ephemeral (not committed); the tests below still gate the deploy.
      - name: Install dependencies (resilient to optional-dep lockfile drift)
        run: npm ci || (echo "::warning::npm ci rejected the lockfile (likely cross-platform optional-dep drift) — repairing with npm install" && npm install --no-audit --no-fund)
      # Gate the deploy on a green ROOM SERVER: the room server is party/index.ts,
      # which imports only `@/engine` and `@/server`, so those two trees' tests —
      # not the UI/art suites — are what must be green to ship it safely. See the
      # header comment for why gating on the whole `npm test` run kept stranding
      # the server. The full suite still runs (non-blocking) in `full-suite` below.
      - name: Engine + server rules tests (the room-server gate)
        run: npx vitest run src/engine src/server
      - run: npm run typecheck
      # Pass the edge its runtime vars. Without HOMM3BG_APP_URL the edge cannot
      # verify a signed-in player cross-origin, so admins can't moderate rooms
      # and verified-account-only rooms lock everyone out. Each var is passed
      # only when its secret is set, so an unconfigured optional secret is a
      # no-op (the deploy still succeeds).
      - name: Deploy PartyKit (with edge env vars)
        run: |
          args=()
          if [ -n "${HOMM3BG_APP_URL}" ]; then args+=(--var "HOMM3BG_APP_URL=${HOMM3BG_APP_URL}"); fi
          if [ -n "${HOMM3BG_ADMIN_KEY}" ]; then args+=(--var "HOMM3BG_ADMIN_KEY=${HOMM3BG_ADMIN_KEY}"); fi
          if [ -n "${HOMM3BG_MATCH_REPORT_KEY}" ]; then args+=(--var "HOMM3BG_MATCH_REPORT_KEY=${HOMM3BG_MATCH_REPORT_KEY}"); fi
          if [ "${#args[@]}" -eq 0 ]; then
            echo "::warning::No edge env vars set — set the HOMM3BG_APP_URL repo secret so admins can moderate rooms and verified accounts work on the edge."
          else
            echo "Passing ${#args[@]} edge var(s) to partykit deploy."
          fi
          npx partykit deploy "${args[@]}"
        env:
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
          PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}
          HOMM3BG_APP_URL: ${{ secrets.HOMM3BG_APP_URL }}
          HOMM3BG_ADMIN_KEY: ${{ secrets.HOMM3BG_ADMIN_KEY }}
          HOMM3BG_MATCH_REPORT_KEY: ${{ secrets.HOMM3BG_MATCH_REPORT_KEY }}

  # Non-blocking full test suite (UI + art + everything else) purely for signal.
  # It runs in parallel with `deploy-partykit` and NEVER blocks it: a UI-component
  # regression or a too-small placeholder art file will annotate this job red
  # WITHOUT stranding the authoritative room server. Fix what it surfaces, but the
  # engine ships either way.
  full-suite:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (resilient to optional-dep lockfile drift)
        run: npm ci || (echo "::warning::npm ci rejected the lockfile — repairing with npm install" && npm install --no-audit --no-fund)
      - name: Full test suite (non-blocking signal)
        run: npm test
