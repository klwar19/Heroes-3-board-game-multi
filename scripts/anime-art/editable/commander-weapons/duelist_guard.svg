<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="743" height="1040" viewBox="0 0 743 1040">
  <title>Duelist Guard — commander artifact card</title>
  <defs>
    <filter id="textShadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dy="2"/><feComponentTransfer><feFuncA type="linear" slope=".8"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="artClip"><rect x="58" y="127" width="627" height="445"/></clipPath>
    <style>
      .titleText { fill: #f2dfa4; font-family: "Times New Roman", Georgia, serif; font-weight: 700; font-size: 40px; text-anchor: middle; filter: url(#textShadow); }
      .tierText { font-family: "Times New Roman", Georgia, serif; font-size: 20px; font-weight: 700; letter-spacing: 3px; text-anchor: middle; filter: url(#textShadow); }
      .slotText { fill: #a89868; font-family: "Times New Roman", Georgia, serif; font-size: 18px; font-weight: 700; letter-spacing: 5px; text-anchor: middle; filter: url(#textShadow); }
      .ruleText { fill: #efe3c2; font-family: "Times New Roman", Georgia, serif; font-size: 21px; font-weight: 700; text-anchor: middle; filter: url(#textShadow); }
    </style>
  </defs>
  <g clip-path="url(#artClip)">
    <rect x="58" y="127" width="627" height="445" fill="#151b16"/>
    <image x="58" y="127" width="627" height="445" preserveAspectRatio="xMidYMid slice" href="duelist_guard-master.png" xlink:href="duelist_guard-master.png"/>
  </g>
  <image x="0" y="0" width="743" height="1040" preserveAspectRatio="none" href="../../raw/artifacts/frame-artifact-keyed.png" xlink:href="../../raw/artifacts/frame-artifact-keyed.png"/>
  <text x="371" y="93" class="titleText">Duelist Guard</text>
  <text x="371" y="630" class="tierText" fill="#c7ccd6">MINOR  ·  COMMANDER ARMOR</text>
  <text x="371" y="664" class="slotText">ARMOR</text>
  <g><text x="371" y="743" class="ruleText">Commander armor: enemy attacks against it</text><text x="371" y="772" class="ruleText">roll with disadvantage during combat round</text><text x="371" y="801" class="ruleText">1.</text><line x1="120" y1="836" x2="623" y2="836" stroke="#6a5a32" stroke-width="1.5" opacity="0.55"/><text x="371" y="842" class="ruleText">Bind permanently to your commander. This</text><text x="371" y="871" class="ruleText">card leaves the game. Gain 1 Minor</text><text x="371" y="900" class="ruleText">Artifact.</text></g>
</svg>